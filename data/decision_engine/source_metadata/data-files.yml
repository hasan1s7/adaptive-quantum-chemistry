wbm_summary:
  url: https://figshare.com/files/71653870
  path: wbm/2026-11-19-wbm-summary.csv.gz
  description: Computed material properties only, no structures. Available properties
    are VASP energy, formation energy, energy above the convex hull, volume, band
    gap, number of sites per unit cell, and more. The MP2020-corrected formation energy
    and hull-distance columns use the `MaterialsProject2020Compatibility` defaults
    of current `pymatgen` (anion corrections require an oxidation state <= -1, see
    https://github.com/materialsproject/pymatgen/pull/3803) for both the WBM entries
    and the MP entries spanning the convex hull, matching the corrections applied
    to model predictions.
